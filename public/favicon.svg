<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Ice-blue dark background -->
  <rect width="32" height="32" rx="7" fill="#071828"/>
  <rect width="32" height="32" rx="7" fill="url(#bg-grad)" opacity="0.6"/>

  <!-- Snowflake crystal — 6 arms -->
  <line x1="16" y1="16" x2="16"    y2="5"     stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="16" y1="16" x2="25.53" y2="10.5"  stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="16" y1="16" x2="25.53" y2="21.5"  stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="16" y1="16" x2="16"    y2="27"    stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="16" y1="16" x2="6.47"  y2="21.5"  stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="16" y1="16" x2="6.47"  y2="10.5"  stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>

  <!-- Branches — top arm -->
  <line x1="16"    y1="9"    x2="19.46" y2="7"     stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="16"    y1="9"    x2="12.54" y2="7"     stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <!-- Branches — upper-right arm -->
  <line x1="22.06" y1="12.5" x2="25.53" y2="14.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="22.06" y1="12.5" x2="22.06" y2="8.5"   stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <!-- Branches — lower-right arm -->
  <line x1="22.06" y1="19.5" x2="22.06" y2="23.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="22.06" y1="19.5" x2="25.53" y2="17.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <!-- Branches — bottom arm -->
  <line x1="16"    y1="23"   x2="12.54" y2="25"    stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="16"    y1="23"   x2="19.46" y2="25"    stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <!-- Branches — lower-left arm -->
  <line x1="9.94"  y1="19.5" x2="6.47"  y2="17.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="9.94"  y1="19.5" x2="9.94"  y2="23.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <!-- Branches — upper-left arm -->
  <line x1="9.94"  y1="12.5" x2="9.94"  y2="8.5"   stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <line x1="9.94"  y1="12.5" x2="6.47"  y2="14.5"  stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>

  <!-- Tip crystals -->
  <circle cx="16"    cy="5"    r="1.5" fill="#b8eeff"/>
  <circle cx="25.53" cy="10.5" r="1.5" fill="#b8eeff"/>
  <circle cx="25.53" cy="21.5" r="1.5" fill="#b8eeff"/>
  <circle cx="16"    cy="27"   r="1.5" fill="#b8eeff"/>
  <circle cx="6.47"  cy="21.5" r="1.5" fill="#b8eeff"/>
  <circle cx="6.47"  cy="10.5" r="1.5" fill="#b8eeff"/>
  <!-- Center -->
  <circle cx="16" cy="16" r="2" fill="#dff5ff"/>

  <defs>
    <radialGradient id="bg-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
  </defs>
</svg>
